description = "Drop the always-on rocky activation rule into the current repo for every IDE agent"
prompt = "Write the per-repo rocky rule files into the current repo and report the result. If `src/tools/rocky-init.js` exists in the current repo (a rocky checkout), run `node src/tools/rocky-init.js {{args}}`. Otherwise run the standalone script (self-contained, supports stdin execution): `curl -fsSL https://raw.githubusercontent.com/Theralley/rocky-skill/main/src/tools/rocky-init.js | node - {{args}}`. Use --dry-run first if the user did not pass --force, so we never silently overwrite an existing rule file."
